name: Python CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test-lab1-and-lab2:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install coverage

    # --- LAB 1 TESTS ---
    - name: Run Lab 1 - Vector
      working-directory: ./lab1/3D_Vector
      run: |
        python -m coverage run tests/testVector.py
        python -m coverage report -m --fail-under=90

    - name: Run Lab 1 - Polynomial
      working-directory: ./lab1/Polynomial
      run: |
        python -m coverage run tests/testPolynomial.py
        python -m coverage report -m --fail-under=90

    # --- LAB 2 TESTS ---
    - name: Run Lab 2 - Pharma
      working-directory: ./lab2/Pharma_Distribution
      run: |
        # This uses the .coveragerc file automatically
        python -m coverage run --source=src -m unittest discover -s tests -p "test_*.py"
        python -m coverage report -m --fail-under=90

  release-project:
    needs: [test-lab1-and-lab2]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' 
    permissions:
      contents: write 
    steps:
      - uses: actions/checkout@v4
      
      - name: Zip all completed Labs
        run: |
          mkdir release
          cp -r lab1 release/
          cp -r lab2 release/
          zip -r all-labs-release.zip ./release

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "v1.0-build-${{ github.run_number }}"
          name: "All Labs Release - Build ${{ github.run_number }}"
          generate_release_notes: true
          files: all-labs-release.zip