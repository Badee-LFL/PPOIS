name: CI/CD Testing & Code Quality Pipeline

on:
  push:
    branches: [ "main", "feature_0" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository Code
      uses: actions/checkout@v4

    - name: Set up Python Environment
      uses: actions/setup-python@v5
      with:
        python-version: '3.13'

    - name: Install System Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pytest flake8

    - name: Check Code Quality with Linter (Flake8)
      run: |
        # stop the build if there are Python syntax errors or undefined names
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
        # exit-zero treats all quality style warnings as advice so it doesn't crash your build yet
        flake8 . --count --exit-zero --max-complexity=10 --max-line-length=150 --statistics

    - name: Execute Automated Unit Tests with Pytest
      env:
        PYTHONPATH: ./lab1/3D_vector/src:./lab1/Polynomial/src
      run: |
        pytest
