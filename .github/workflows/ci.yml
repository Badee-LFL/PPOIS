name: Python CI

on:
  push:
    branches: [ "main" ]
    tags:
      - 'lab1*'  # <--- This triggers the workflow ONLY when a tag starting with 'lab1' is pushed
  pull_request:
    branches: [ "main" ]

jobs:
  test-vector:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.13'
    - name: Install dependencies
      run: pip install coverage
    - name: Run Vector tests
      working-directory: ./lab1/3D_Vector/tests
      run: |
        coverage run testVector.py
        coverage report -m --fail-under=90

  test-polynomial:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.13'
    - name: Install dependencies
      run: pip install coverage
    - name: Run Polynomial tests
      working-directory: ./lab1/Polynomial/tests
      run: |
        coverage run testPolynomial.py
        coverage report -m --fail-under=90

  # --- NEW JOB ADDED HERE ---
  release-lab1:
    needs: [test-vector, test-polynomial] # Only runs if the tests pass!
    runs-on: ubuntu-latest
    permissions:
      contents: write # Gives the Action permission to create the release
    steps:
      - uses: actions/checkout@v4
      
      # Optional: If you want to zip your lab1 folder to attach to the release
      - name: Zip Lab 1 files
        run: zip -r lab1-release.zip ./lab1
        
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true # Automatically writes the changelog
          files: lab1-release.zip      # Attaches the zip file to the release