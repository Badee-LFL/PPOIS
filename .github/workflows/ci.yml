name: Python CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test-vector:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.13'
    - name: Install dependencies
      run: pip install coverage
    - name: Run Vector tests
      working-directory: ./lab1/3D_Vector/tests
      run: |
        coverage run testVector.py
        coverage report -m --fail-under=90

  test-polynomial:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.13'
    - name: Install dependencies
      run: pip install coverage
    - name: Run Polynomial tests
      working-directory: ./lab1/Polynomial/tests
      run: |
        coverage run testPolynomial.py
        coverage report -m --fail-under=90