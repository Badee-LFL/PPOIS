name: CI/CD Testing & Code Quality Pipeline

on:
  push:
    branches: [ "main", "feature_0" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository Code
      uses: actions/checkout@v4

    - name: Set up Python Environment
      uses: actions/setup-python@v5
      with:
        python-version: '3.13'

    - name: Install System Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pytest flake8

    - name: Check Code Quality with Linter (Flake8)
      run: |
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
        flake8 . --count --exit-zero --max-complexity=10 --max-line-length=150 --statistics

    - name: Execute Automated Unit Tests with Pytest
      run: |
        # We explicitly pass the Python paths and the exact names of your test files here
        python -m pytest lab1/tests/testVector.py lab1/tests/testmain.py --import-mode=importlib
      env:
        PYTHONPATH: "lab1/3D_vector"
