name: Python CI

on:
  push:
    branches: [ "main", "feature lab1" ] # Added your branch here so it triggers
  pull_request:
    branches: [ "main" ]

jobs:
  test-vector:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.13'
        cache: 'pip'
    - name: Install dependencies
      run: pip install coverage
    - name: Run Vector tests
      working-directory: ./lab1/3D_Vector/tests
      run: |
        coverage run testVector.py
        coverage report -m --fail-under=90

  test-polynomial:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.13'
        cache: 'pip'
    - name: Install dependencies
      run: pip install coverage
    - name: Run Polynomial tests
      working-directory: ./lab1/Polynomial/tests
      run: |
        coverage run testPolynomial.py
        coverage report -m --fail-under=90

  release-lab1:
    needs: [test-vector, test-polynomial] # Only runs if tests pass
    runs-on: ubuntu-latest
    permissions:
      contents: write # REQUIRED to create a release
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Zip Lab 1 files
        run: zip -r lab1-release.zip ./lab1
        
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          # Since we aren't using manual tags, we generate a new tag for every run
          tag_name: "lab1-build-${{ github.run_number }}"
          name: "Lab 1 Release - Build ${{ github.run_number }}"
          generate_release_notes: true
          files: lab1-release.zip